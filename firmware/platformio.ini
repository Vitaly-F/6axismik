; Прошивка платы 6 шаговых двигателей на MIK32 АМУР (К1948ВК018)
; Сборка: VS Code + PlatformIO. Подробности — в README.md.

[platformio]
default_envs = spifi

; ---------- общие настройки ----------
[env]
platform = MIK32
board = mik32v2
framework = framework-mik32v2-sdk

; Программатор (JTAG). Выберите свой:
;   mikron-link  - программатор MIK32 от Микрона или любая плата на FT2232HL (канал B)
;   jlink        - J-Link (в т.ч. китайские клоны)
upload_protocol = jlink
; Частота JTAG, кГц. Если прошивка срывается на длинных проводах — уменьшите до 200.
upload_speed = 500

; Монитор порта (USB-C платы, CH340N)
monitor_speed = 115200
monitor_eol = LF
monitor_echo = yes

; ---------- основной вариант: программа во внешней флеш W25Q32 (DD2) ----------
; На плате перемычки XP4 и XP5 НЕ ставить.
[env:spifi]
board_build.ldscript = spifi
; PlatformIO по умолчанию считает, что памяти 8 КБ (внутренняя EEPROM). Для W25Q32 — 4 МБ.
board_upload.maximum_size = 4194304

; ---------- запасной вариант: без внешней флеш, во внутренней EEPROM (8 КБ) ----------
; Прошивка влезает впритык. На плате надеть перемычку XP5 (BOOT1 на землю), XP4 не ставить.
[env:eeprom]
board_build.ldscript = eeprom
build_flags = -D ENABLE_SPIFI_CACHE=0
